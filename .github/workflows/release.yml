name: 构建 Windows 发行版本
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 需要构建的现有源码标签
        required: true
        default: v4.0.1
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: 安装独立构建环境
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 运行计算与发布检查
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest tests/test_optics.py tests/test_project_docs.py tests/test_release.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建便携程序与许可说明
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --target build/cuda-input --no-deps -r requirements-cuda.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\build_release.ps1 -CudaRuntime (Join-Path $PWD 'build/cuda-input')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/verify_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 上传附件并保留草稿
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseFolder = "releases/$env:RELEASE_TAG"
          gh release upload $env:RELEASE_TAG "$releaseFolder/GaussianLab-$env:RELEASE_TAG-Windows-x64.zip" "$releaseFolder/GaussianLab-$env:RELEASE_TAG-Qt-Corresponding-Source.zip" "$releaseFolder/GaussianLab-$env:RELEASE_TAG-Application-Source.zip" "$releaseFolder/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
