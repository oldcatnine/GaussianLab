name: Build Windows release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing source tag to build
        required: true
        default: v0.1.0
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Install isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run calculation and release checks
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest tests/test_optics.py tests/test_project_docs.py tests/test_release.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable executable and notices
        shell: pwsh
        run: |
          .\scripts\build_release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/verify_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload $env:RELEASE_TAG releases/v0.1.0/GaussianLab-v0.1.0-Windows-x64.zip releases/v0.1.0/GaussianLab-v0.1.0-Qt-Corresponding-Source.zip releases/v0.1.0/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
